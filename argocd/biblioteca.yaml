apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: biblioteca
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cabrasky/biblioteca
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: biblioteca
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
